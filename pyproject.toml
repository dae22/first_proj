[project]
name = "config"
version = "0.1.0"
description = ""
authors = [
    { name = "dae22", email = "dae-22@mail.ru" }
]
readme = "README.md"
requires-python = ">=3.13, <4"
dependencies = [
    "django (>=5.2.5,<6.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "psycopg[binary] (>=3.2.9,<4.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
ruff = "^0.12.8"
pre-commit = "^4.3.0"

##############################

[tool.ruff]
lint.select = ["E", "F", "W", "DJ", "I", "UP"]
lint.ignore = ["F401"]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["first-proj"]
