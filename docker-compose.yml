services:
  db:
    image: postgres:17.6
    container_name: booking_db
    environment:
      POSTGRES_PASSWORD: 1998
      POSTGRES_DB: booking_db
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:/var/lib/postgres/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d booking_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    container_name: booking_web
    command: >
      sh -c "python manage.py migrate && python manage.py runserver"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:1998@db:5432/booking_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
